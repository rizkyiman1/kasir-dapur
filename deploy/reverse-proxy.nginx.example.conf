# nginx reverse proxy TEMPLATE — Kasir Dapur Backend
# NOT production-ready until you replace placeholders and obtain TLS certificates.
#
# Placeholders:
#   __STAGING_API_DOMAIN__     e.g. api-staging.dapur-rasa.com
#   __BACKEND_UPSTREAM__       e.g. 127.0.0.1:8080
#   __TLS_CERT_PATH__          e.g. /etc/letsencrypt/live/__STAGING_API_DOMAIN__/fullchain.pem
#   __TLS_KEY_PATH__           e.g. /etc/letsencrypt/live/__STAGING_API_DOMAIN__/privkey.pem
#
# Install snippet to sites-available, then:
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name __STAGING_API_DOMAIN__;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS API
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __STAGING_API_DOMAIN__;

    ssl_certificate     __TLS_CERT_PATH__;
    ssl_certificate_key __TLS_KEY_PATH__;

    # Enable HSTS only after HTTPS is verified working (start with short max-age)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Request body limit (align with backend request size middleware)
    client_max_body_size 2m;

    location / {
        proxy_pass http://__BACKEND_UPSTREAM__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Webhook + checkout may be slow occasionally
        proxy_buffering off;
    }
}

# Backend env when using this proxy on same host:
#   TRUST_PROXY_HEADERS=true
#   TRUSTED_PROXY_IPS=127.0.0.1
