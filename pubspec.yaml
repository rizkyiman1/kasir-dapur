name: kasir_dapur
description: Kasir, Stok & Laporan Usaha
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.6
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  image_picker: ^1.1.2
  intl: any
  logger: ^2.6.1
  mobile_scanner: ^7.4.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  permission_handler: ^11.3.1
  print_bluetooth_thermal: ^1.2.2
  share_plus: ^13.3.0
  sqflite: ^2.4.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/ic_launcher_1024.png"
  adaptive_icon_background: "#1F6B4A"
  adaptive_icon_foreground: "assets/icons/ic_launcher_1024.png"
  min_sdk_android: 21
